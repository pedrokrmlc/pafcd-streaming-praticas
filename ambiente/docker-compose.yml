# Ambiente do curso: cluster Kafka com 3 brokers (KRaft), Jupyter + Spark, Postgres e Grafana.
# Na VM, as senhas vêm do arquivo .env gerado pelo cloud-init.
name: streaming

x-kafka: &kafka-base
  image: apache/kafka:4.0.0
  restart: unless-stopped

x-kafka-env: &kafka-env
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_RETENTION_HOURS: 72
  KAFKA_HEAP_OPTS: -Xmx512m -Xms512m

services:
  kafka1:
    <<: *kafka-base
    container_name: kafka1
    hostname: kafka1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092

  kafka2:
    <<: *kafka-base
    container_name: kafka2
    hostname: kafka2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092

  kafka3:
    <<: *kafka-base
    container_name: kafka3
    hostname: kafka3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on: [kafka1, kafka2, kafka3]
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: curso-streaming
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: aluno
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-aluno}

  jupyter:
    build: ./jupyter
    container_name: jupyter
    restart: unless-stopped
    depends_on: [kafka1, kafka2, kafka3, postgres]
    ports:
      - "8888:8888"
      - "4040-4045:4040-4045"   # Spark UI (uma porta por sessão Spark aberta)
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-aluno}
      KAFKA_BOOTSTRAP: kafka1:9092,kafka2:9092,kafka3:9092
      PG_HOST: postgres
      PG_DB: streaming
      PG_USER: streaming
      PG_PASSWORD: streaming
    volumes:
      - ../notebooks:/home/aluno/notebooks
      - spark-dados:/home/aluno/dados     # checkpoints e saídas do Spark
    mem_limit: 3500m

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: streaming
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: streaming
    volumes:
      - pg-dados:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    depends_on: [postgres]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-dados:/var/lib/grafana

volumes:
  spark-dados:
  pg-dados:
  grafana-dados:
