apiVersion: 1
datasources:
  - name: Postgres
    uid: pg-streaming
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: streaming
    isDefault: true
    jsonData:
      database: streaming
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: streaming
